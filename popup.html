<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Usage Tracker</title>
  <link rel="stylesheet" href="popup.css">
  <script src="pace.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <span class="terminal-mark" aria-hidden="true">&gt;_</span>
    <h1>Codex <span>usage</span></h1>
  </header>
  <main id="limits" aria-label="Usage limits"></main>
  <footer>
    <p id="status" role="status">Loading…</p>
    <a class="open-usage" href="https://chatgpt.com/settings/usage?tab=overview" target="_blank" rel="noopener noreferrer" title="Open or reload Usage Overview to update saved usage or switch accounts.">Open usage <span aria-hidden="true">↗</span></a>
  </footer>
</body>
</html>
